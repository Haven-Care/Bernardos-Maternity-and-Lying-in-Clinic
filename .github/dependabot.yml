# Weekly dependency updates. Minor and patch bumps arrive grouped, one pull
# request per package, so security fixes are not buried under noise.
#
# Every update targets dev, the development branch, so it goes through the
# same checks and release as other work. GitHub reads this file only from the
# default branch (main), so it takes effect once dev is first released to main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
