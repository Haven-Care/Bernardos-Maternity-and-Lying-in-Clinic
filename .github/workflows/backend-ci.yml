name: Backend CI

# Runs on every PR, and again on the branch after a merge.
#
# No `paths:` filter, deliberately. This job is a *required* status check, and a
# filtered job simply never reports on a PR it doesn't match — GitHub then waits
# forever for a check that will never arrive, so a frontend-only PR could never
# merge. Removing the filter costs a few seconds of CI per PR and removes the
# deadlock entirely.
#
# The push trigger exists because `pull_request` alone verifies nothing after
# the merge button: a PR that was green against an older base can still break
# the branch it lands on.
on:
  pull_request:
    branches:
      - main
      - backend-main
  push:
    branches:
      - main
      - backend-main

jobs:
  backend-ci:
    name: Lint, Build & Test (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
