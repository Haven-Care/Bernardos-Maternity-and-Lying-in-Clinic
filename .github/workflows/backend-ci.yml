name: Backend CI

on:
  pull_request:
    branches:
      - main
      - backend-main
    paths:
      - 'backend/**'
      # The contract lives in the frontend, and the backend compiles against a
      # mirror of it. A change here that is not synced is exactly the drift this
      # job exists to catch, so it has to be able to trigger the job.
      - 'frontend/src/types/**'
      - 'scripts/sync-types.mjs'

jobs:
  backend-ci:
    name: Lint, Build & Test (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Runs from the repo root, not backend/, and needs no dependencies —
      # the script uses node builtins only. Fails if backend/src/contract/ has
      # drifted from frontend/src/types/, which is the one way the two packages
      # can silently disagree about the API.
      - name: Check contract is in sync
        working-directory: .
        run: npm run sync:types:check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
