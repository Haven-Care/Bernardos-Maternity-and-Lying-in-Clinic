name: Backend CI

# Runs on every PR, and again on the branch after a merge.
#
# No `paths:` filter, deliberately. This job is meant to be a *required* status
# check, and a filtered job doesn't report a neutral result — it never reports
# at all, so GitHub waits forever for a check that will never arrive and a
# frontend-only PR could never merge.
#
# The push trigger exists because `pull_request` alone verifies nothing after
# the merge button: a PR that was green against an older base can still break
# the branch it lands on.
#
# deployment/prep is the integration branch for production-readiness work
# until it is merged to main, so it is checked like the others.
on:
  pull_request:
    branches:
      - main
      - deployment/prep
      - backend-main
      - frontend-main
  push:
    branches:
      - main
      - deployment/prep
      - backend-main
      - frontend-main

# Read-only token: no job here pushes, comments or publishes anything.
permissions:
  contents: read

jobs:
  backend-ci:
    name: Lint, Build & Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `backend/` does not exist on `main` yet — it was scaffolded on a feature
      # branch and has never reached the default branch. Without this guard,
      # setup-node fails outright on the missing cache-dependency-path, so the
      # required check would sit red on main until the backend lands.
      #
      # Skipped steps still report the job as successful, which is what makes
      # this safe to require. Drop the guard once backend/ is on every branch
      # this workflow runs against.
      - name: Detect backend package
        id: detect
        run: |
          if [ -f backend/package-lock.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No backend/ on this ref — nothing to lint, build or test.'
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json

      # Runs from the repo root, not backend/, and needs no dependencies —
      # the script uses node builtins only. Fails if backend/src/contract/ has
      # drifted from frontend/src/types/, which is the one way the two packages
      # can silently disagree about the API.
      - name: Check contract is in sync
        if: steps.detect.outputs.present == 'true'
        working-directory: .
        run: npm run sync:types:check

      # Every migration, the seed and supabase/tests/*.sql against an in-memory
      # Postgres (PGlite), so a broken migration or a weakened RLS posture fails
      # the pull request instead of the next deploy. --ignore-scripts skips the
      # Supabase CLI binary download, which this check does not use. Not a
      # substitute for the database suites below, which still need a real stack.
      - name: Install root tooling
        if: steps.detect.outputs.present == 'true'
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Check migrations and SQL tests
        if: steps.detect.outputs.present == 'true'
        working-directory: .
        run: npm run db:check

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm ci

      # Production dependencies only: a high or critical advisory in something
      # the deployed API loads fails the job. Dev-only advisories are left to
      # Dependabot.
      - name: Audit production dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm run lint

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm run build

      # HTTP smoke tests run here. Database integration tests skip unless a
      # local Supabase stack is available; a green job is not full DB coverage.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm test
