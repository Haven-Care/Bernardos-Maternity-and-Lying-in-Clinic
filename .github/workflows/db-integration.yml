name: Database integration

# Runs the backend suites that need a real Supabase stack (116 tests that skip
# on a machine without Docker). REQUIRE_DB=1 turns a skip into a failure, so a
# stack that did not start cannot pass as green.
#
# Not part of backend-ci.yml on purpose: starting the stack takes minutes, and
# the lint/build/test check is the required one. It first ran green on 02ec77b;
# a repository admin can now make it a required check.
on:
  pull_request:
    branches:
      - main
      - deployment/prep
  push:
    branches:
      - main
      - deployment/prep

# Read-only token: the job starts a throwaway stack and pushes nothing.
permissions:
  contents: read

jobs:
  db-integration:
    name: Backend suites against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json

      # The Supabase CLI comes from the root package-lock.json, the same version
      # developers run, instead of a setup action tracking `latest`: a new CLI
      # major can change `supabase status` output under this job. Install
      # scripts stay on here, because they download the CLI binary.
      - name: Install root tooling
        run: npm ci

      - name: Start local Supabase
        id: stack
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime

      - name: Export stack settings
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/stack.env"
          {
            echo "SUPABASE_URL=$(grep '^API_URL=' "$RUNNER_TEMP/stack.env" | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' "$RUNNER_TEMP/stack.env" | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/stack.env" | cut -d= -f2- | tr -d '"')"
            echo "REQUIRE_DB=1"
          } >> "$GITHUB_ENV"

      # The same files `npm run db:check` runs in PGlite, this time against the
      # stack's real auth, storage and roles. Each file rolls itself back, so
      # the suites below still start from the seeded database. The posture
      # check runs once more on its own, outside any test's transaction.
      - name: Run SQL tests
        run: |
          db="$(docker ps -qf name=supabase_db)"
          for file in supabase/tests/*.sql; do
            echo "::group::$file"
            docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q < "$file"
            echo "::endgroup::"
          done
          docker exec "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'select assert_rls_posture();'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Seed staff accounts
        working-directory: backend
        run: npm run seed:staff

      - name: Run suites
        working-directory: backend
        run: npm test

      # backend/src/db/types.ts must be exactly what `npm run db:types` writes
      # for the migrated schema, so a hand edit or a forgotten regeneration
      # fails here. Types generated from a hosted project differ (they add an
      # __InternalSupabase block), so regenerate locally. Runs whenever the
      # stack started, even if the suites failed. The diff goes into an
      # annotation, which the public API shows without signing in, and into
      # the job summary.
      - name: Check generated database types
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          npx supabase gen types typescript --local --schema public > "$RUNNER_TEMP/types.ts"
          if diff -u backend/src/db/types.ts "$RUNNER_TEMP/types.ts" > "$RUNNER_TEMP/types.diff"; then
            echo 'backend/src/db/types.ts matches the migrated schema.'
            exit 0
          fi
          {
            echo '### backend/src/db/types.ts differs from the migrated schema'
            echo
            echo 'Run `npm run db:types` against a local stack, or apply this diff, and commit the result.'
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/types.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message="$(head -n 300 "$RUNNER_TEMP/types.diff")"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error file=backend/src/db/types.ts,title=Generated types differ::$message"
          exit 1

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
