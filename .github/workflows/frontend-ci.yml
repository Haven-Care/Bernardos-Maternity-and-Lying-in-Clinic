name: Frontend CI

# Runs on every PR, and again on the branch after a merge.
#
# No `paths:` filter, deliberately. This job is a *required* status check, and a
# filtered job simply never reports on a PR it doesn't match — GitHub then waits
# forever for a check that will never arrive, so a backend-only PR could never
# merge. Removing the filter costs half a minute of CI per PR and removes the
# deadlock entirely.
#
# The push trigger exists because `pull_request` alone verifies nothing after
# the merge button: a PR that was green against an older base can still break
# the branch it lands on.
#
# deployment/prep is the integration branch for production-readiness work
# until it is merged to main, so it is checked like the others.
on:
  pull_request:
    branches:
      - main
      - deployment/prep
      - frontend-main
      - backend-main
  push:
    branches:
      - main
      - deployment/prep
      - frontend-main
      - backend-main

# Read-only token: no job here pushes, comments or publishes anything.
permissions:
  contents: read

jobs:
  frontend-ci:
    name: Lint, Build & Test (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: a high or critical advisory in something
      # shipped to the browser fails the job. Dev-only advisories are left to
      # Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
