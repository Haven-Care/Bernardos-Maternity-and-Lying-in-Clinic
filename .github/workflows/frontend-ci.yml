name: Frontend CI

# Runs on every PR, and again on the branch after a merge.
#
# No `paths:` filter, deliberately. This job is a *required* status check, and a
# filtered job simply never reports on a PR it doesn't match — GitHub then waits
# forever for a check that will never arrive, so a backend-only PR could never
# merge. Removing the filter costs half a minute of CI per PR and removes the
# deadlock entirely.
#
# The push trigger exists because `pull_request` alone verifies nothing after
# the merge button: a PR that was green against an older base can still break
# the branch it lands on.
#
# dev is the development branch: frontend-main and backend-main merge into it,
# and it merges into main to release, so it is checked like the others.
on:
  pull_request:
    branches:
      - main
      - dev
      - frontend-main
      - backend-main
  push:
    branches:
      - main
      - dev
      - frontend-main
      - backend-main

# Read-only token: no job here pushes, comments or publishes anything.
permissions:
  contents: read

jobs:
  frontend-ci:
    name: Lint, Build & Test (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: a high or critical advisory in something
      # shipped to the browser fails the job. Dev-only advisories are left to
      # Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
